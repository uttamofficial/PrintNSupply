<!DOCTYPE html>
<html>
<head>
    <title>Cart Functionality Test</title>
</head>
<body>
    <h1>Cart Functionality Test</h1>
    <button id="testCart">Test Cart Functionality</button>
    <div id="result"></div>

    <script>
        document.getElementById('testCart').addEventListener('click', async () => {
            try {
                // Fetch products
                const response = await fetch('/api/products');
                const products = await response.json();
                
                if (products && products.length > 0) {
                    document.getElementById('result').innerHTML = `
                        <h2>Products Loaded Successfully</h2>
                        <p>Found ${products.length} products</p>
                        <h3>First Product:</h3>
                        <pre>${JSON.stringify(products[0], null, 2)}</pre>
                    `;
                } else {
                    document.getElementById('result').innerHTML = '<p>No products found</p>';
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
