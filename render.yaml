services:
  # Frontend Service
  - type: web
    name: printnsupply-frontend
    env: static
    buildCommand: chmod +x build-with-env.sh && ./build-with-env.sh
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://printnsupply-backend.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://qlchpejqhdjzbfikvlzw.supabase.co
      - key: VITE_SUPABASE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsY2hwZWpxaGRqemJmaWt2bHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk5MDA1MTgsImV4cCI6MjA3NTQ3NjUxOH0.e6M4R5P0o6xanOOmiyBL_2REzasx2nVQoI1DtAVGAGA
      - key: VITE_CLOUDINARY_CLOUD_NAME
        value: dcwzukqqw
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        value: printnsupply
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: pk_test_51SG0CkCeoTVIAxUvuRKLMB0AmTRL422LqKbW2famGDWXo74ueXLgeuzGO6Qc3b50We9Oh7kqRok2XN62oc3WId7u00y7mgxB1u
      - key: VITE_CLERK_PUBLISHABLE_KEY
        value: pk_test_bGVnYWwtYW50LTk2LmNsZXJrLmFjY291bnRzLmRldiQ

  # Backend Service
  - type: web
    name: printnsupply-backend
    env: node
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production

      - key: FRONTEND_URL
        value: https://printnsupply.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false